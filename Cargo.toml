[package]
name = "xmip-core-operate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-operate"
description = "What every operator surface calls, implemented once: the C ABI's operating exports over the runtime, xmip_operate.h, in the native library the surfaces load, and the designer's view and edits of cluster.xmip."
publish.workspace = true

[lib]
path = "src/lib.rs"
# rlib for the estate, cdylib for the surfaces. ADR-0014: the xmip executable,
# the PowerShell module and the GUI are .NET and P/Invoke a C ABI, so there
# has to be a native library that exports xmip_operate_v1 for them to load.
# This is it.
crate-type = ["rlib", "cdylib"]

[lints.rust]
# deny, not forbid, because forbid cannot be lowered anywhere. The C boundary
# is one folder, src/ffi/ (ADR-0050, amendment 2026-11-16): the operator's
# table and the exports of xmip_operate.h (ADR-0027). Each file there allows
# unsafe at its top with its reason; nothing outside the folder may, and
# test/Unsafe.Test.ps1 holds it.
unsafe_code = "deny"

# What a remote surface needs is always linked; every dependency marked
# optional is the node's, and only the `node` feature turns it on (see
# [features]).
[dependencies]
# The node and the surface the exports answer for: every rule an export
# calls is the runtime's, and this crate holds the exports alone. The runtime
# never depends on this one (ADR-0058, amendment 2026-11-16).
runtime = { workspace = true, default-features = false }
# Every technology's declaration, gathered, none of their code (ADR-0064,
# amendment 2026-11-26): carried into the runtime's catalogue before an
# export reads it, so every surface suggests and checks a Location's
# settings by them. A platform service depends on no technology, so the
# runtime cannot gather them (`catalogue`).
declaration = { workspace = true, optional = true }
abi = { workspace = true }
xcore = { workspace = true }
node = { workspace = true }
observe = { workspace = true }
# Section 9: a program's audit record, forwarded to the capability that owns
# it (ADR-0062). xaudit, as xcore, because the export's own file is ffi/audit.rs.
xaudit = { workspace = true }
# What this library hands audit as the program a .NET program audits
# through (ffi/audit.rs, program): the file sink, and the operating system's
# log for when audit cannot persist, the Windows Event Log or the local
# syslog. Each log's crate is empty off its own platform, so each is a
# dependency of its own platform alone, in the target tables below (ADR-0062,
# amendment 2026-11-19).
audit-file = { workspace = true }
# Section 11: Events, subscribed from any language: the Event and its
# filter are the event crate's (ADR-0065). xevent, as xaudit, because the
# export's own file is ffi/event.rs.
xevent = { workspace = true, optional = true }
# The process's hub section 11 forwards to, the cluster's `delivery`
# (ADR-0065, amendment 2026-11-13), which comes with `node`; a remote build
# links no hub.
xcluster = { workspace = true, default-features = false, optional = true }
# Section 27: every configuration document a surface reads, writes or
# edits, the phone's own among them, is read by configure, the runtime's one
# reader (ADR-0031, amendment 2026-11-17), so a remote build links it too.
configure = { workspace = true }
# Section 10 hands the designer's views and edits to its language server as
# JSON, in memory only (ADR-0031 clause 2, ADR-0064).
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
# A document's tables as section 27 hands them across, and the designer's
# edits, which change the lines of the cluster's file they touch and leave
# the developer's comments and layout as they were (ADR-0064 clause 4).
toml = "1.2.1"
toml_edit = { version = "0.25.19", features = ["serde"], optional = true }
# A Subscription, its filter and where it routes are route's, read here from
# an Xmip Application and never modelled again (ADR-0064); a filter is one
# line of Xmip's expression language, and the designer's rows are a view of
# its compiled tree, never a second grammar (ADR-0066); the language is a
# capability of its own (ADR-0066, amendment 2026-11-28).
route = { workspace = true, optional = true }
expression = { workspace = true, optional = true }
# An Event subscriber's identity and the gate's decision on it (section 11),
# and the authenticated identity a role check takes (section 18).
context = { workspace = true, optional = true }
authorize = { workspace = true, optional = true }
# Section 24: the scripts IT runs for a database server, written by Xmip
# Storage's schema.
persist = { workspace = true, optional = true }
secret = { workspace = true, optional = true }
tls = { workspace = true }
# A person's certificate (ADR-0034, amendment 2026-10-15): the request a
# surface makes — the phone's build too — and, on a node's, the signing by
# the authority `[provision.operator]` names; the cluster's authority kept in
# a folder (section 23).
provision = { workspace = true }
# An authority's PEM (section 23), and the wide string a test names a
# library to Windows by (`codec::wide`).
codec = { workspace = true, optional = true }

# The operating system's log of each platform (ffi/audit.rs, program).
[target.'cfg(windows)'.dependencies]
audit-windows-event-log = { workspace = true }

[target.'cfg(unix)'.dependencies]
audit-syslog = { workspace = true }

[dev-dependencies]
# The runtime's fixtures, the gates' stand-ins and the test authority
# (`fixture`), which the exports' tests run a node with. Without the default
# features, so a remote build's tests stay a remote build
# (`--no-default-features --features remote`).
runtime = { workspace = true, default-features = false, features = ["test-support"] }
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
configure = { workspace = true, features = ["test-support"] }
# A folder of a test's own (`file::temporary::Folder`; ADR-0021, amendment
# 2026-11-19).
file = { workspace = true, features = ["test-support"] }
# The folder of a test whose Event subscriptions audit in it, removed once
# audit's keeper kept their records (`audit_file::temporary`; ADR-0065,
# amendment 2026-11-20).
audit-file = { workspace = true, features = ["test-support"] }
# The wide string a test of a pinned library names it to Windows by
# (`codec::wide`), in a remote build too.
codec = { workspace = true }
# The Party an Event gate's test admits (`ffi::event::gate`), and the
# authenticated identity a role check's test holds, in a remote build too
# (`ffi::security_role`).
party = { workspace = true }
context = { workspace = true }

[features]
# A node and every surface on a machine that runs one.
default = ["node"]
# The node's exports: `xmip_operate.h` sections 1, 5, 6 and 10 to 16,
# section 17's serve exports, section 19's signing (`xmip_operator_sign_v1`,
# by the authority `[provision.operator]` names) and section 21, a host's
# listener in Xmip's own protection and the certificate an authority issues
# it (`ffi::secure_listener`), and section 22, a node's certificate from the
# cluster's authority (`ffi::node_certificate`), and section 23, the
# cluster's authority kept in a folder and a node's certificate carried
# across an air gap (`ffi::authority`), and section 25, every Report listed
# and a Quest probing a node's configuration (`ffi::report`), and section
# 26, a module library probed through the runtime's one loader
# (`ffi::module_probe`, `runtime/loader`); and the designer (`design`);
# and every technology's declaration, which sections 6 and 12 carry into
# the runtime's catalogue (`catalogue`). Everything a remote surface has,
# too.
node = [
    "remote",
    "runtime/node",
    "runtime/loader",
    "dep:declaration",
    "dep:serde",
    "dep:xevent",
    "xcluster/delivery",
    "dep:toml_edit",
    "dep:route",
    "dep:expression",
    "dep:context",
    "dep:authorize",
    "dep:persist",
    "dep:secret",
    "dep:codec",
    "dep:xcluster",
]
# A surface that follows nodes on other machines and runs none, the phone
# (ADR-0014, amendment 2026-10-14), over the runtime's `plane::remote`:
# `xmip_operate.h` section 7 (the rules), section 8 (a publication read),
# section 9 (a program's audit record), section 18 (the role and the gate),
# section 27 (a configuration document read, written and set),
# section 17's client exports (`xmip_remote_*`, the kept open too) and
# section 19's request (`xmip_operator_request_v1`, a person's key and
# request, and its two halves around a keeper's signature,
# `xmip_operator_information_v1` and `xmip_operator_assemble_v1`, and the
# chain and anchors kept whole, `xmip_operator_keep_v1`). Built alone with
# `--no-default-features --features remote`.
remote = ["runtime/remote"]
